# Copper Linux — /etc/wpa_supplicant.conf
# handcrafted by 12hrformat
#
# This file is written by the first-boot wizard when you enter a WiFi
# network name and password. copper-init reads it at boot and hands it
# to wpa_supplicant before running DHCP on the wireless interface.
#
# To add or change networks manually:
#
# network={
#     ssid="YourNetworkName"
#     psk="YourPassword"
#     key_mgmt=WPA-PSK
# }
#
# For open (no-password) networks:
#
# network={
#     ssid="OpenNetwork"
#     key_mgmt=NONE
# }
#
# Multiple network{} blocks are supported; wpa_supplicant picks the
# strongest available one automatically.
#
ctrl_interface=/run/wpa_supplicant
ctrl_interface_group=0
update_config=1
