# Copper Linux — X11 configuration
# handcrafted by 12hrformat
#
# Uses the modesetting driver for broad hardware compatibility.
# GLX is enabled for OpenGL acceleration. Keyboard and mouse
# are configured with sensible defaults.

Section "ServerFlags"
    Option "DontVTSwitch" "false"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
EndSection

Section "Device"
    Identifier  "Card0"
    Driver      "modesetting"
    Option      "AccelMethod" "glamor"
    Option      "DRI" "3"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "Card0"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080" "1600x900" "1366x768" "1280x720"
    EndSubSection
EndSection

Section "InputClass"
    Identifier  "Keyboard0"
    MatchIsKeyboard "on"
    Option  "XkbLayout" "us"
    Option  "XkbModel" "pc105"
    Option  "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection

Section "InputClass"
    Identifier  "Mouse0"
    MatchIsPointer "on"
    Option  "AccelerationProfile" "2"
    Option  "AccelerationScheme" "predictable"
EndSection

Section "Module"
    Load  "glx"
    Load  "dri3"
EndSection
